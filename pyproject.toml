[project]
name = "phash-match"
version = "0.1.0"
description = "Find visually similar images (resized, recompressed, recolored copies) with perceptual hashes"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Levent Çeliksan"}]
dependencies = ["pillow>=9.1", "numpy>=1.21"]

[project.optional-dependencies]
test = ["pytest", "imagehash"]

[project.scripts]
phash-match = "phash_match.cli:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["phash_match"]
